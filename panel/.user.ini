; TRIVIAX — límites ampliados para el generador de tableros.
; Permite subir/procesar imágenes grandes. La subida por fragmentos (chunks)
; del generador igualmente funciona aunque el servidor ignore este archivo
; (mod_php), porque cada fragmento es pequeño.
upload_max_filesize = 64M
post_max_size = 68M
memory_limit = 512M
max_input_time = 300
max_execution_time = 300
